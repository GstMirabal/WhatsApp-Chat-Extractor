name: CI

# The verification `ci_gate.py` looks for. Runs on the repository's own
# infrastructure rather than on the operator's Mac, which is the difference
# between "the tests passed here" and "the tests passed".
#
# No live WhatsApp Web: every test drives stub rows and synthetic scroll
# passes, and no Playwright browser is downloaded.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.6.0"
      - name: Lint
        run: ruff check .

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the version the operator runs.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  no-exported-chats:
    name: no exported chats committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse any tracked file under data/
        # data/ holds real conversations and is gitignored. A tracked file there
        # means personal data reached the repository, which no test would catch.
        run: |
          tracked=$(git ls-files data/ | head -20)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked files under data/ — exported chats must never be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "data/ holds no tracked files."
