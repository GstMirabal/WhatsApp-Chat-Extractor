[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-chat-extractor"
version = "0.11.0"
description = "Export a WhatsApp Web chat's full text history to local pseudonymous JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Gustavo" }]
dependencies = [
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
wa-extract = "whatsapp_chat_extractor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Ruff configuration lives in `.ruff.toml` (see the header there for why).
